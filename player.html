<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Player</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Noto Sans",sans-serif;
    -webkit-tap-highlight-color:transparent}
  html,body{height:100dvh}
  movi-player{position:fixed;inset:0;width:100%;height:100%;display:block;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:24px;text-align:center;line-height:1.7;z-index:50}
  #overlay.show{display:flex}
  #overlay .box{max-width:640px}
  #overlay code{background:#1c1c1e;border:1px solid #333;padding:2px 8px;border-radius:6px;
    word-break:break-all;font-size:.92em;color:#8ab4ff}
  #overlay .icon{font-size:42px;margin-bottom:10px;display:block}
  #overlay a.btn,#overlay button.btn{display:inline-block;margin-top:18px;padding:10px 22px;border:0;
    border-radius:999px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-size:15px;
    font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit}
  #spinner{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;z-index:40}
  #spinner.hide{display:none}
  .ring{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.14);
    border-top-color:#8b5cf6;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #spinner p{margin:0;color:#9aa0a6;font-size:14px}
</style>
</head>
<body>

<div id="spinner">
  <div class="ring" role="status" aria-label="লোড হচ্ছে"></div>
  <p>প্লেয়ার লোড হচ্ছে… প্রথমবার একটু সময় লাগতে পারে</p>
</div>

<div id="overlay"><div class="box" id="msg"></div></div>

<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">
    এই প্লেয়ার চালাতে ব্রাউজারে JavaScript চালু করুন।
  </div>
</noscript>

<script type="module">
  const $overlay = document.getElementById('overlay');
  const $msg     = document.getElementById('msg');
  const $spinner = document.getElementById('spinner');

  function show(html){
    $msg.innerHTML = html;
    $overlay.classList.add('show');
    $spinner.classList.add('hide');
  }
  function hideOverlay(){ $overlay.classList.remove('show'); }
  function doneLoading(){ $spinner.classList.add('hide'); }

  const q   = new URLSearchParams(location.search);
  const raw = (q.get('url') || q.get('src') || '').trim();

  /* ---------- 1. Validate the URL ---------- */
  let src = '';
  try {
    const u = new URL(raw);
    if (u.protocol === 'http:' || u.protocol === 'https:') src = u.href;
  } catch (_) { /* not a valid absolute URL */ }

  if (!src) {
    document.title = 'Player';
    show(raw
      ? '<span class="icon">⚠️</span>এটি সঠিক ভিডিও লিংক নয়।<br>শুধুমাত্র <code>http://</code> বা <code>https://</code> দিয়ে শুরু হওয়া লিংক সাপোর্টেড।'
      : '<span class="icon">🎬</span>ব্যবহারবিধি:<br><code>/player.html?url=ভিডিও_লিংক</code><br><br>উদাহরণ:<br><code>/player.html?url=https://example.com/video.mp4</code><br><br><a class="btn" href="/">হোম পেজে ফিরুন</a>');
    throw new Error('invalid url');
  }

  /* ---------- 2. Load the player engine (self-contained, WASM embedded) ---------- */
  let PlayerEl = null;
  try {
    await import('./assets/element.js');
    PlayerEl = customElements.get('movi-player') || true;
  } catch (err) {
    show('<span class="icon">📡</span>প্লেয়ার ইঞ্জিন লোড করা যায়নি।<br>ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।<br><br>'
      + '<button class="btn" onclick="location.reload()">আবার চেষ্টা করুন</button>');
    throw err;
  }

  /* ---------- 3. Build the player ---------- */
  const p = document.createElement('movi-player');
  p.setAttribute('src', src);
  p.setAttribute('renderer', 'canvas');
  p.setAttribute('controls', '');
  p.setAttribute('objectfit', 'control');
  p.setAttribute('gesturefs', '');
  p.setAttribute('fastseek', '');
  p.setAttribute('stablevolume', '');
  p.setAttribute('fallback', 'native');

  /* Boolean flags: &autoplay=1 &muted=1 &loop=1 &resume=1 */
  for (const f of ['autoplay', 'muted', 'loop', 'resume']) {
    const v = q.get(f);
    if (v === '1' || v === 'true' || v === '') p.setAttribute(f, '');
  }

  /* Poster image: &poster=https://…/img.jpg */
  const poster = q.get('poster');
  if (poster && /^https?:\/\//i.test(poster)) p.setAttribute('poster', poster);

  /* Optional safe passthrough flags */
  const fit = (q.get('fit') || '').toLowerCase();
  if (['contain','cover','fill','zoom','control'].includes(fit)) p.setAttribute('objectfit', fit);

  const theme = (q.get('theme') || '').toLowerCase();
  if (theme === 'dark' || theme === 'light') p.setAttribute('theme', theme);

  const rotate = (q.get('rotate') || '').toLowerCase();
  if (['0','90','180','270'].includes(rotate)) p.setAttribute('rotate', rotate);

  const engine = (q.get('engine') || '').toLowerCase();
  if (['wasm','shaka','dashjs','hlsjs','native'].includes(engine)) p.setAttribute('engine', engine);

  /* Title from filename (safe — assigned as text, never HTML) */
  let name = 'Player';
  try {
    name = decodeURIComponent(src.split('/').pop().split('?')[0] || '') || 'Player';
  } catch (_) { name = src.split('/').pop().split('?')[0] || 'Player'; }
  document.title = name;
  try { p.setAttribute('title', name); } catch (_) {}

  document.body.appendChild(p);

  /* Start time: &t=90 (seconds) */
  const t = parseFloat(q.get('t'));
  if (t > 0) {
    const seek = () => { try { p.currentTime = t; } catch (_) {} };
    p.addEventListener('loadedmetadata', seek, { once: true });
  }

  /* ---------- 4. Lifecycle feedback ---------- */
  let ready = false;
  p.addEventListener('loadedmetadata', () => { ready = true; doneLoading(); }, { once: true });
  p.addEventListener('canplay',        () => doneLoading(), { once: true });

  /* If nothing loads within 30s, drop the spinner but keep the player visible */
  setTimeout(() => { if (!ready) doneLoading(); }, 30000);

  p.addEventListener('error', () => {
    doneLoading();
    show('<span class="icon">❌</span>ভিডিওটি চালানো যায়নি।<br><br>'
      + 'লিংকটি সঠিক কি না যাচাই করুন। ভিডিও সার্ভারে <b>CORS</b> এবং <b>Range</b> রিকোয়েস্ট '
      + 'সাপোর্ট থাকা প্রয়োজন।<br><br>'
      + '<button class="btn" onclick="location.reload()">আবার চেষ্টা করুন</button>');
  });
</script>
</body>
</html>
